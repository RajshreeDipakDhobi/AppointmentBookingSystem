<header class="topbar" [class.public-mode]="isPublic">

  <!-- PUBLIC HEADER MODE -->
  <ng-container *ngIf="isPublic">
    <div class="topbar-container-public">

      <!-- Brand Logo -->
      <a routerLink="/booking-portal" class="brand-link" title="AppointEase">
        <div class="brand-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
            <line x1="16" x2="16" y1="2" y2="6" />
            <line x1="8" x2="8" y1="2" y2="6" />
            <line x1="3" x2="21" y1="10" y2="10" />
            <path d="m9 16 2 2 4-4" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Appoint<span class="brand-accent">Ease</span></span>
        </div>
      </a>

      <!-- Right Side Actions -->
      <div class="topbar-right">
        <!-- Logged-in Customer / User Profile Dropdown Menu -->
        <div *ngIf="isAuthenticated()" class="user-menu-wrapper">
          <button type="button" class="user-profile-trigger" (click)="toggleUserMenu($event)"
            [class.is-open]="isUserMenuOpen()" aria-haspopup="true" [attr.aria-expanded]="isUserMenuOpen()">
            <div class="avatar-box">
              <img *ngIf="user?.profilePictureUrl" [src]="user?.profilePictureUrl" alt="Avatar" class="topbar-avatar-img" />
              <span *ngIf="!user?.profilePictureUrl">{{ initials }}</span>
            </div>
            <span class="user-fullname">{{ userFullName }}</span>
            <svg class="chevron-icon" [class.rotated]="isUserMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="13"
              height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Dropdown Card -->
          <div *ngIf="isUserMenuOpen()" class="user-dropdown-card animate-scale-up" (click)="$event.stopPropagation()">
            <!-- User Header Inside Dropdown -->
            <div class="dropdown-header">
              <div class="dropdown-avatar">
                <img *ngIf="user?.profilePictureUrl" [src]="user?.profilePictureUrl" alt="Avatar" class="topbar-avatar-img" />
                <span *ngIf="!user?.profilePictureUrl">{{ initials }}</span>
              </div>
              <div class="dropdown-user-details">
                <span class="dropdown-fullname">{{ userFullName }}</span>
                <span class="dropdown-email">{{ user?.email }}</span>
                <div *ngIf="isAdminOrStaff()" class="dropdown-role-row">
                  <span class="role-badge-chip">
                    {{ roleBadge }}
                  </span>
                </div>
              </div>
            </div>

            <div class="dropdown-separator"></div>

            <!-- Menu Navigation Links -->
            <div class="dropdown-items-group">
              <!-- Profile & Security (All Users) -->
              <button type="button" class="dropdown-action-btn" (click)="openProfileModal()">
                <div class="action-icon icon-emerald">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
                <div class="action-label-wrap">
                  <span class="action-label">Profile & Security</span>
                  <span class="action-subtext">Manage personal info & password</span>
                </div>
                <svg class="action-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>

              <!-- View Appointments (Customer) -->
              <button *ngIf="isCustomer()" type="button" class="dropdown-action-btn" (click)="goToMyAppointments()">
                <div class="action-icon icon-blue">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </div>
                <div class="action-label-wrap">
                  <span class="action-label">View Appointments</span>
                  <span class="action-subtext">Check status & history</span>
                </div>
                <svg class="action-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>

              <!-- Admin Portal Link (Admin / Staff) -->
              <button *ngIf="isAdminOrStaff()" type="button" class="dropdown-action-btn" (click)="goToDashboard()">
                <div class="action-icon icon-indigo">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="9"></rect>
                    <rect x="14" y="3" width="7" height="5"></rect>
                    <rect x="14" y="12" width="7" height="9"></rect>
                    <rect x="3" y="16" width="7" height="5"></rect>
                  </svg>
                </div>
                <div class="action-label-wrap">
                  <span class="action-label">Admin Portal</span>
                  <span class="action-subtext">Manage operations & appointments</span>
                </div>
                <svg class="action-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>

            <div class="dropdown-separator"></div>

            <!-- Logout Option -->
            <button type="button" class="dropdown-action-btn btn-dropdown-logout" (click)="onLogout()">
              <div class="action-icon icon-danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
              </div>
              <div class="action-label-wrap">
                <span class="action-label">Logout</span>
                <span class="action-subtext">Sign out of your account</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Guest: Sign In / Sign Up Button -->
        <button *ngIf="!isAuthenticated()" type="button" class="btn-login-public" (click)="openLoginDrawer('login')">
          <span>Sign In / Sign Up</span>
        </button>
      </div>

    </div>
  </ng-container>

  <!-- INTERNAL LAYOUT MODE -->
  <ng-container *ngIf="!isPublic">
    <!-- Left Side: Mobile Menu Button -->
    <div class="topbar-left">
      <button type="button" class="btn-hamburger" (click)="layoutService.toggleSidebar()"
        aria-label="Toggle Navigation Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Right Side: User Profile & Actions (Dropdown with Logout inside for all users) -->
    <div class="topbar-right">
      <div *ngIf="isAuthenticated()" class="user-menu-wrapper">
        <button type="button" class="user-profile-trigger" (click)="toggleUserMenu($event)"
          [class.is-open]="isUserMenuOpen()" aria-haspopup="true" [attr.aria-expanded]="isUserMenuOpen()">
          <div class="avatar-box">
            <img *ngIf="user?.profilePictureUrl" [src]="user?.profilePictureUrl" alt="Avatar" class="topbar-avatar-img" />
            <span *ngIf="!user?.profilePictureUrl">{{ initials }}</span>
          </div>
          <span class="user-fullname">{{ userFullName }}</span>
          <svg class="chevron-icon" [class.rotated]="isUserMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="13"
            height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Dropdown Card -->
        <div *ngIf="isUserMenuOpen()" class="user-dropdown-card animate-scale-up" (click)="$event.stopPropagation()">
          <!-- User Header Inside Dropdown -->
          <div class="dropdown-header">
            <div class="dropdown-avatar">
              <img *ngIf="user?.profilePictureUrl" [src]="user?.profilePictureUrl" alt="Avatar" class="topbar-avatar-img" />
              <span *ngIf="!user?.profilePictureUrl">{{ initials }}</span>
            </div>
            <div class="dropdown-user-details">
              <span class="dropdown-fullname">{{ userFullName }}</span>
              <span class="dropdown-email">{{ user?.email }}</span>
              <div *ngIf="isAdminOrStaff()" class="dropdown-role-row">
                <span class="role-badge-chip">
                  {{ roleBadge }}
                </span>
              </div>
            </div>
          </div>

          <div class="dropdown-separator"></div>

          <!-- Menu Navigation Links -->
          <div class="dropdown-items-group">
            <!-- Profile & Security Option -->
            <button type="button" class="dropdown-action-btn" (click)="openProfileModal()">
              <div class="action-icon icon-emerald">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <div class="action-label-wrap">
                <span class="action-label">Profile & Security</span>
                <span class="action-subtext">Manage personal info & password</span>
              </div>
              <svg class="action-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>

          <div class="dropdown-separator"></div>

          <!-- Logout Option -->
          <button type="button" class="dropdown-action-btn btn-dropdown-logout" (click)="onLogout()">
            <div class="action-icon icon-danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </div>
            <div class="action-label-wrap">
              <span class="action-label">Logout</span>
              <span class="action-subtext">Sign out of your account</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </ng-container>

</header>

<!-- Global Booking Modal accessible from Topbar -->
<app-booking-modal *ngIf="isBookingModalOpen()" (close)="isBookingModalOpen.set(false)">
</app-booking-modal>

<!-- Profile & Security Modal -->
<app-profile-modal *ngIf="isProfileModalOpen()" [initialTab]="profileInitialTab()" (close)="isProfileModalOpen.set(false)">
</app-profile-modal>
