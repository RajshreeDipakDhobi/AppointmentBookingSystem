<div class="pagination-container" *ngIf="totalCount > 0">
  <!-- Left Side: Clean Total Counter -->
  <div class="pagination-info">
    <span class="info-text">
      Total <strong class="info-num">{{ totalCount }}</strong> {{ totalCount === 1 ? 'entry' : 'entries' }}
    </span>
  </div>

  <!-- Right Side: Dropdown & Navigation Controls -->
  <div class="pagination-right">
    <!-- Rows Per Page Selector (Luxury Custom Dropup Popover) -->
    <div class="page-size-selector">
      <span class="size-label">Rows per page:</span>
      <div class="custom-select-anchor page-size-anchor" [class.menu-open]="isSizeDropdownOpen">
        <button
          type="button"
          class="page-size-trigger"
          (click)="toggleSizeDropdown($event)"
          aria-haspopup="listbox"
          [attr.aria-expanded]="isSizeDropdownOpen"
          title="Select rows per page"
        >
          <span class="size-val">{{ pageSize }}</span>
          <svg class="trigger-chevron" [class.rotated]="isSizeDropdownOpen" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        <!-- Dropdown Menu (Opens downwards by default, upwards if space below is insufficient) -->
        <div 
          *ngIf="isSizeDropdownOpen" 
          class="custom-dropdown-popover page-size-popover animate-scale-up"
          [class.opens-up]="openDirection === 'up'"
          [class.opens-down]="openDirection === 'down'"
          (click)="$event.stopPropagation()"
        >
          <div class="popover-items-list">
            <button
              *ngFor="let opt of pageSizeOptions"
              type="button"
              class="popover-option-item page-size-option-item"
              [class.option-selected]="opt === pageSize"
              (click)="selectPageSize(opt, $event)"
            >
              <span class="option-title">{{ opt }} rows</span>
              <svg *ngIf="opt === pageSize" class="option-check-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Subtle Divider -->
    <div class="pagination-divider"></div>

    <!-- Page Nav Buttons -->
    <div class="pagination-controls">
      <button 
        type="button" 
        class="page-nav-btn" 
        [disabled]="pageNumber <= 1" 
        (click)="goToPage(pageNumber - 1)"
        title="Previous page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Prev</span>
      </button>

      <div class="page-numbers">
        <ng-container *ngFor="let p of visiblePages">
          <span *ngIf="p === '...'" class="page-ellipsis">•••</span>
          <button 
            *ngIf="p !== '...'" 
            type="button" 
            class="page-number-btn" 
            [class.active]="p === pageNumber"
            (click)="goToPage(p)">
            {{ p }}
          </button>
        </ng-container>
      </div>

      <button 
        type="button" 
        class="page-nav-btn" 
        [disabled]="pageNumber >= totalPages" 
        (click)="goToPage(pageNumber + 1)"
        title="Next page">
        <span>Next</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>
</div>
