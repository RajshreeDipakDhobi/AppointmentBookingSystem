<div *ngIf="confirmService.isOpen() && confirmService.options() as opts" class="confirm-backdrop animate-fade-in"
  role="dialog" aria-modal="true" [attr.aria-labelledby]="'confirmModalTitle'">
  <div class="confirm-dialog animate-scale-up">

    <!-- Header with Icon & Close Button -->
    <div class="confirm-header">
      <div class="confirm-icon-wrap" [ngClass]="'icon-' + (opts.variant || 'primary')">
        <!-- Danger Icon -->
        <svg *ngIf="opts.variant === 'danger'" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          <line x1="10" y1="11" x2="10" y2="17" />
          <line x1="14" y1="11" x2="14" y2="17" />
        </svg>

        <!-- Warning Icon -->
        <svg *ngIf="opts.variant === 'warning'" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>

        <!-- Primary / Info Icon -->
        <svg *ngIf="opts.variant !== 'danger' && opts.variant !== 'warning'" xmlns="http://www.w3.org/2000/svg"
          width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>

      <button type="button" class="btn-dialog-close" (click)="onCancel()" aria-label="Close dialog">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="confirm-content">
      <h3 id="confirmModalTitle" class="confirm-title">{{ opts.title }}</h3>
      <p class="confirm-message">{{ opts.message }}</p>
    </div>

    <!-- Actions -->
    <div class="confirm-actions">
      <button *ngIf="!opts.isAlertOnly" type="button" class="btn-cancel" (click)="onCancel()">
        {{ opts.cancelText || 'No' }}
      </button>

      <button type="button" class="btn-action" [ngClass]="'btn-' + (opts.variant || 'primary')" (click)="onConfirm()">
        {{ opts.confirmText || 'Yes' }}
      </button>
    </div>

  </div>
</div>
